<!DOCTYPE html>
<html>

<head>

    <title>Edit Weather Reading</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>Climate Intelligence</h2>

        <a href="/">Dashboard</a>

        <a href="/weather">Weather Data</a>

        <a href="/heatwaves">Heatwave Events</a>

        <a href="/alerts">Alerts</a>

        <a href="/forecasts">Forecasts</a>

    </div>


    <!-- MAIN CONTENT -->

    <div class="main-content">

        <div class="section-header">

            <h2>Edit Weather Reading</h2>

            <a href="/weather">
                ← Back to Weather Data
            </a>

        </div>


        <div class="table-container">

            <form method="POST"
                  action="/weather/edit/{{ reading[0] }}">


                <div class="form-grid">


                    <!-- Weather Station -->

                    <div class="form-group">

                        <label>
                            Weather Station
                        </label>

                        <select
                            name="station_id"
                            required>

                            {% for station in stations %}

                            <option
                                value="{{ station[0] }}"
                                {% if station[0] == reading[1] %}
                                selected
                                {% endif %}>

                                {{ station[1] }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Reading Date -->

                    <div class="form-group">

                        <label>
                            Reading Date
                        </label>

                        <input
                            type="date"
                            name="reading_date"
                            value="{{ reading[2] }}"
                            required>

                    </div>


                    <!-- Reading Time -->

                    <div class="form-group">

                        <label>
                            Reading Time
                        </label>

                        <input
                            type="time"
                            name="reading_time"
                            value="{{ reading[3] }}"
                            required>

                    </div>


                    <!-- Temperature -->

                    <div class="form-group">

                        <label>
                            Temperature
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="temperature"
                            value="{{ reading[4] }}"
                            required>

                    </div>


                    <!-- Humidity -->

                    <div class="form-group">

                        <label>
                            Humidity
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="humidity"
                            value="{{ reading[5] }}"
                            required>

                    </div>


                    <!-- Wind Speed -->

                    <div class="form-group">

                        <label>
                            Wind Speed
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="wind_speed"
                            value="{{ reading[6] }}"
                            required>

                    </div>


                    <!-- Rainfall -->

                    <div class="form-group">

                        <label>
                            Rainfall
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="rainfall"
                            value="{{ reading[7] }}"
                            required>

                    </div>


                    <!-- Pressure -->

                    <div class="form-group">

                        <label>
                            Pressure
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="pressure"
                            value="{{ reading[8] }}"
                            required>

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="save-button">

                        Update Reading

                    </button>


                    <a
                        href="/weather"
                        class="cancel-button">

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </div>

</body>

</html>
